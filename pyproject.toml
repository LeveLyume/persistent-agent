[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-agent"
version = "0.1.0"
description = "A persistent agent with extensible memory and tools"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]